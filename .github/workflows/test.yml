name: test

on:
  push:
  pull_request:

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tests
        run: bash tests/run.sh
      - name: ShellCheck
        run: shellcheck --severity=error install.sh quick-install.sh bin/* lib/flowcraft/*.sh tests/*.sh tests/unit/*.sh
      - name: Network namespace integration
        run: sudo bash tests/integration/network-namespace.sh
