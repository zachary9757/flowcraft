name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install static analysis tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck shfmt iproute2
      - name: Bash syntax
        run: bash -n bin/flowcraft lib/flowcraft/*.sh kernel/scripts/*.sh tests/*.sh
      - name: ShellCheck
        # Modules intentionally share globals after being sourced by bin/flowcraft;
        # SC2034 cannot see those cross-file reads.
        run: shellcheck --severity=warning --exclude=SC2034 bin/flowcraft lib/flowcraft/*.sh kernel/scripts/*.sh tests/*.sh
      - name: Formatting
        run: shfmt -d -i 2 -ci bin/flowcraft lib/flowcraft/*.sh tests/*.sh
      - name: Unit and dry-run tests
        run: |
          bash tests/self-test.sh
          bash tests/install-smoke.sh
      - name: Network namespace qdisc test
        run: sudo bash tests/network-namespace.sh
